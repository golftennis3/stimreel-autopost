name: Post Reel
on:
  workflow_dispatch:
    inputs:
      count:
        description: "Скільки відео зробити"
        default: "1"
        required: true
      publish:
        description: "Публікувати в Instagram (вимкни — лише згенерувати для перевірки)"
        type: boolean
        default: true
  # Автоматичний розклад (UTC). Щоб увімкнути — прибери # у двох рядках нижче.
  # schedule:
  #   - cron: "37 9,16 * * *"
permissions:
  contents: write
concurrency:
  group: autopost
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright
      - name: Generate and post
        run: xvfb-run -a python cloud_run.py
        env:
          COUNT: ${{ inputs.count || '1' }}
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          STIMREEL_EMAIL: ${{ secrets.STIMREEL_EMAIL }}
          STIMREEL_PASSWORD: ${{ secrets.STIMREEL_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep videos for 3 days
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: videos, path: "out/", if-no-files-found: ignore, retention-days: 3 }
      - name: Save history
        if: always()
        run: |
          git config user.name "stimreel-bot"
          git config user.email "stimreel-bot@users.noreply.github.com"
          git add history.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "history: update" && git pull --rebase -q && git push -q)
