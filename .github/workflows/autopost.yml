name: Post Reel
on:
  workflow_dispatch:
    inputs:
      count:
        description: "Скільки відео зробити"
        default: "1"
        required: true
      publish:
        description: "Публікувати в Instagram (вимкни — лише згенерувати для перевірки)"
        type: boolean
        default: true
  # Автоматичний розклад (UTC). Щоб увімкнути — прибери # у двох рядках нижче.
  # schedule:
  #   - cron: "37 9,16 * * *"
permissions:
  contents: write
concurrency:
  group: autopost
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright
      - run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Generate and post
        run: xvfb-run -a python cloud_run.py
        env:
          COUNT: ${{ inputs.count || '1' }}
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          STIMREEL_EMAIL: ${{ secrets.STIMREEL_EMAIL }}
          STIMREEL_PASSWORD: ${{ secrets.STIMREEL_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep videos for 3 days
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: videos, path: "out/", if-no-files-found: ignore, retention-days: 3 }
      - name: Save history
        if: always()
        run: |
          [ -f history.json ] || exit 0
          git config user.name "stimreel-bot"
          git config user.email "stimreel-bot@users.noreply.github.com"
          cp history.json /tmp/history.new.json
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git checkout -q -f -B main origin/main
            python merge_history.py /tmp/history.new.json history.json
            git add history.json
            git diff --cached --quiet && exit 0
            git commit -q -m "history: update"
            git push -q origin main && exit 0
            sleep $((i * 3))
          done
          exit 1
