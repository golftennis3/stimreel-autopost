name: Render test
on:
  push:
    paths: ["render_test.py", ".github/workflows/render-test.yml", "stimreel_gen.py"]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright
      - run: google-chrome --version
      - run: xvfb-run -a python render_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: render-test, path: "out/", if-no-files-found: warn }
